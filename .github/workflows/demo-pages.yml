name: Publish Divepoint demo

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: divepoint-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/package-lock.json
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - run: npm ci --prefix game
      - run: npm --prefix game run build -- --mode demo
      - run: PYTHONPATH=backend uv run --project backend --locked python game/scripts/export_demo.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
